[project]
name = "telemetry"
version = "0.1.0"
description = "Sensor telemetry analytics and predictive maintenance platform"
requires-python = ">=3.12"
dependencies = [
    # PostgreSQL driver. A real dependency, not a dev tool: src/telemetry/db.py
    # imports it, so anyone installing this package needs it.
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Exploration tools only. Nothing in src/ may import these - the moment real
# code does, the package moves up into [project] dependencies.
notebook = ["jupyterlab>=4.0", "ipykernel>=6.29", "pandas>=2.2", "matplotlib>=3.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# schema.sql is not Python, so setuptools would leave it out of an installed
# wheel. It is part of the package, not a loose file next to it.
[tool.setuptools.package-data]
telemetry = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running PostgreSQL; skipped automatically when absent",
]
